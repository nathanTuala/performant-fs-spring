services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfs
      POSTGRES_PASSWORD: pfs
      POSTGRES_DB: pfs
    # 5434, so it can run next to the Node version's database (5433) and a host Postgres (5432).
    ports: ["5434:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfs"]
      interval: 2s
      retries: 30

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pfs
      SPRING_DATASOURCE_USERNAME: pfs
      SPRING_DATASOURCE_PASSWORD: pfs
    # The UI and API on http://localhost:8091 (8090 is left for ./gradlew bootRun).
    ports: ["8091:8080"]
    volumes: [blobs:/data]

volumes:
  db:
  blobs:
