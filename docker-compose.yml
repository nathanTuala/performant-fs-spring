services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pfs
      POSTGRES_PASSWORD: pfs
      POSTGRES_DB: pfs
    # 5434, so it can run next to the Node version's database (5433) and a host Postgres (5432).
    ports: ["5434:5432"]
    volumes: [db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfs"]
      interval: 2s
      retries: 30

volumes:
  db:
