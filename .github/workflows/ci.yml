name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # The embedding model is pinned by checksum in build.gradle.kts; download it once.
      - uses: actions/cache@v4
        with:
          path: server/models
          key: embedding-model-${{ hashFiles('server/build.gradle.kts') }}
      # Integration tests start a real Postgres through Testcontainers (Docker is on the runner).
      - run: ./gradlew build --console=plain

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build
