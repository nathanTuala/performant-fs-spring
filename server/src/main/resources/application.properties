spring.application.name=performant-fs

# Local development defaults; every value can be overridden by environment variables
# (SPRING_DATASOURCE_URL, …) in Docker and production.
spring.datasource.url=jdbc:postgresql://localhost:5434/pfs
spring.datasource.username=pfs
spring.datasource.password=pfs

# 8080 is often taken on dev machines; override with SERVER_PORT.
server.port=8090

# Each upload holds its request thread while bytes stream in. Virtual threads make that cheap,
# so hundreds of concurrent uploads don't exhaust a fixed Tomcat thread pool.
spring.threads.virtual.enabled=true

# A demo account with sample files, for reviewers (see the README). Its password is public by
# design: never put anything real in it. Set both to empty (PFS_DEMO_EMAIL=) to have none.
pfs.demo-email=demo@performant-fs.dev
pfs.demo-password=try-the-demo-2026

# Observability. Every request is traced (sampled at 100%: this isn't a high-traffic app), and the
# trace id comes back in the X-Trace-Id header. Nothing leaves the process unless the "otel"
# profile is active (see application-otel.properties), so no collector is needed to run the app.
management.tracing.sampling.probability=1.0
management.tracing.export.enabled=false
management.otlp.metrics.export.enabled=false
management.logging.export.enabled=false
# Spring Security's internal steps would add half a dozen spans to every trace.
management.observations.enable.spring.security=false
# Put search text on traces, so a search can be looked up by what was typed. Fine on your own
# machine; leave it off (the default) where other people's searches would be recorded.
pfs.trace-search-text=true
# Publish latency buckets for the app's timers and HTTP requests, so p95s can be computed downstream.
management.metrics.distribution.percentiles-histogram.pfs=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Only health over HTTP; metrics are pushed over OTLP rather than scraped.
management.endpoints.web.exposure.include=health
