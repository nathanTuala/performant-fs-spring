# Export traces, metrics and logs over OTLP/HTTP, e.g. to the grafana/otel-lgtm container:
#   docker compose --profile observability up -d lgtm
#   SPRING_PROFILES_ACTIVE=otel ./gradlew bootRun
# OTLP_ENDPOINT points elsewhere (the compose app uses http://lgtm:4318).
management.tracing.export.enabled=true
management.otlp.metrics.export.enabled=true
management.logging.export.enabled=true
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.opentelemetry.logging.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
# Push metrics every 10 s so dashboards move while you watch.
management.otlp.metrics.export.step=10s
